<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 홈페이지</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav {
      margin-top: 15px;
    }

    nav button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>

<body>

  <header>
    <h1>나의 홈페이지</h1>

    <nav>
      <button onclick="showPage('home')">홈</button>
      <button onclick="showPage('about')">소개</button>
      <button onclick="showPage('diary')">기록</button>
      <button onclick="showPage('gallery')">갤러리</button>
    </nav>
  </header>

  <main>

    <section id="home" class="page active">
      <h2>안녕하세요!</h2>
      <p>여기는 나의 개인 홈페이지입니다.</p>
    </section>

    <section id="about" class="page">
      <h2>나의 소개</h2>
      <p>여기에 자기소개를 작성하세요.</p>
    </section>

    <section id="diary" class="page">
      <h2>기록</h2>
      <p>여기에 글이나 일상을 기록할 수 있습니다.</p>
    </section>

    <section id="gallery" class="page">
      <h2>갤러리</h2>
      <p>여기에 사진 등을 넣을 수 있습니다.</p>
    </section>

  </main>

  <script>
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      document.getElementById(pageId).classList.add('active');
    }
  </script>

</body>
</html>
